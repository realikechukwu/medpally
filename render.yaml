# Render blueprint. Create with: Render dashboard -> New -> Blueprint -> this repo.
#
# The database is NOT declared here: it lives in Supabase, and Django owns its
# schema. Never create a Render Postgres alongside it.
#
# Ingestion is NOT declared here either. It runs entirely in GitHub Actions
# (.github/workflows/nightly.yml, 03:00 UTC daily). Render does not run cron on
# free instances, so the catch-up cron this file used to declare cost ~$1/mo;
# it was dropped once the repository went public and Actions minutes became
# free. Render therefore serves HTTP and nothing else.
#
# Free-tier shape, deliberately:
#   * `migrate` runs in buildCommand rather than as a preDeployCommand, because
#     preDeployCommand needs a paid instance type. This is safe here only
#     because a free service runs exactly one instance — with replicas it would
#     be a migration race and would have to move to preDeploy.
#   * The web service sleeps after ~15 min idle and takes ~1 min to wake.

services:
  - type: web
    name: medpally
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate --noinput
    # 2 workers x 2 threads to match CONN_MAX_AGE=0 against the Supabase
    # session pooler: in session mode every connection holds a pool slot for
    # its whole life and the free-tier pool is about 15 slots.
    startCommand: >-
      uv run gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --timeout 60
      --access-logfile -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.13"
      # sync: false means Render prompts for the value and stores it as a
      # secret rather than keeping it in this file.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "0"
