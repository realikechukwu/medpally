{% with is_saved=state.saved_at|default_if_none:False %}
<form class="action-form" data-cache-invalidate="feed saved account" hx-post="{% url 'feed:toggle_save' paper.pmid %}" hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  <button type="submit" class="icon-btn icon-btn-save{% if is_saved %} is-active{% endif %}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="{% if is_saved %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg>
    <span class="icon-btn-label">{% if is_saved %}Saved{% else %}Save{% endif %}</span>
  </button>
</form>
{% endwith %}
