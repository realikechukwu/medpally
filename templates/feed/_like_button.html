{% with is_liked=state.liked_at|default_if_none:False %}
<form hx-post="{% url 'feed:toggle_like' paper.pmid %}" hx-target="this" hx-swap="outerHTML" style="display:inline">
  {% csrf_token %}
  <button type="submit" class="icon-btn icon-btn-like{% if is_liked %} is-active{% endif %}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="{% if is_liked %}#C4402F{% else %}none{% endif %}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    <span>{% if is_liked %}Liked{% else %}Like{% endif %}</span>
  </button>
</form>
{% endwith %}
