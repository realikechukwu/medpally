{% with is_liked=state.liked_at|default_if_none:False %}
<form class="action-form" data-cache-invalidate="feed liked" hx-post="{% url 'feed:toggle_like' paper.pmid %}" hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  <button type="submit" class="icon-btn icon-btn-like{% if is_liked %} is-active{% endif %}">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="{% if is_liked %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.3s-8.3-4.9-8.3-10.6A4.6 4.6 0 0 1 8.3 5c1.6 0 2.9.8 3.7 2 .8-1.2 2.1-2 3.7-2a4.6 4.6 0 0 1 4.6 4.7c0 5.7-8.3 10.6-8.3 10.6z"/></svg>
    <span class="icon-btn-label">{% if is_liked %}Liked{% else %}Like{% endif %}</span>
  </button>
</form>
{% endwith %}
