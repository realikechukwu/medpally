{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Your feed</h1>
  {% if request.user.profile.specialty %}<p class="page-subtitle">{{ request.user.profile.specialty.name }}</p>{% endif %}
  <div class="chip-row">
    <a class="pill-tab{% if not unseen_only %} pill-tab-active{% endif %}" href="{% url 'feed:list' %}">All</a>
    <a class="pill-tab{% if unseen_only %} pill-tab-active{% endif %}" href="{% url 'feed:list' %}?unseen=1">Unseen</a>
  </div>
</div>

<div id="cards">
  {% include "feed/_cards.html" %}
</div>
{% endblock %}
