{% comment %}
  Each tab carries an outline and a filled glyph; CSS shows the filled one on
  the selected tab, as the iOS tab bar does with SF Symbols.
{% endcomment %}
<nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
  <div class="bottom-nav-inner">
    <a data-tab-nav href="{% url 'feed:list' %}" class="{% if active_tab == 'feed' %}is-active{% endif %}"{% if active_tab == 'feed' %} aria-current="page"{% endif %}>
      <svg class="tab-icon tab-icon-outline" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5"/></svg>
      <svg class="tab-icon tab-icon-filled" width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6.5 3.2h11a3.3 3.3 0 0 1 3.3 3.3v11a3.3 3.3 0 0 1-3.3 3.3h-11a3.3 3.3 0 0 1-3.3-3.3v-11a3.3 3.3 0 0 1 3.3-3.3ZM7.6 8.2a.8.8 0 0 0 0 1.6h8.8a.8.8 0 0 0 0-1.6H7.6Zm0 3.5a.8.8 0 0 0 0 1.6h8.8a.8.8 0 0 0 0-1.6H7.6Zm0 3.5a.8.8 0 0 0 0 1.6h4.8a.8.8 0 0 0 0-1.6H7.6Z"/></svg>
      <span>Feed</span>
    </a>
    <a data-tab-nav href="{% url 'feed:read_later' %}" class="{% if active_tab == 'saved' %}is-active{% endif %}"{% if active_tab == 'saved' %} aria-current="page"{% endif %}>
      <svg class="tab-icon tab-icon-outline" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg>
      <svg class="tab-icon tab-icon-filled" width="25" height="25" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg>
      <span>Saved</span>
    </a>
    <a data-tab-nav href="{% url 'feed:search' %}" class="{% if active_tab == 'search' %}is-active{% endif %}"{% if active_tab == 'search' %} aria-current="page"{% endif %}>
      <svg class="tab-icon tab-icon-outline" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.7-4.7"/></svg>
      <svg class="tab-icon tab-icon-filled" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.7-4.7"/></svg>
      <span>Search</span>
    </a>
    <a data-tab-nav href="{% url 'accounts:account' %}" class="{% if active_tab == 'account' %}is-active{% endif %}"{% if active_tab == 'account' %} aria-current="page"{% endif %}>
      <svg class="tab-icon tab-icon-outline" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-3.9 3.4-6 7.5-6s7.5 2.1 7.5 6"/></svg>
      <svg class="tab-icon tab-icon-filled" width="25" height="25" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.6"/><path d="M3.8 20.2c0-4.3 3.8-6.6 8.2-6.6s8.2 2.3 8.2 6.6c0 .6-.4.9-1 .9H4.8c-.6 0-1-.3-1-.9Z"/></svg>
      <span>Account</span>
    </a>
  </div>
</nav>
