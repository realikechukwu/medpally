[project]
name = "medpally"
version = "0.1.0"
description = "Per-user feed of summarised medical literature"
requires-python = ">=3.13,<3.14"

dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "dj-database-url>=2.3",
    "django-allauth[socialaccount]>=65.4",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "openai>=1.60",
    "requests>=2.32",
    "PyYAML>=6.0",
    "sentry-sdk[django]>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "responses>=0.25",
    "freezegun>=1.5",
    "jsonschema>=4.23",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "types-requests",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "apps", "config"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # Django class attrs are conventionally plain mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/"]

# engine/ is pure Python with no Django and is held to a stricter standard —
# it is the code we depend on being correct and it is trivially checkable.
[[tool.mypy.overrides]]
module = "engine.*"
strict = true

[[tool.mypy.overrides]]
module = ["factory.*", "responses.*", "allauth.*", "environ.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "network: hits the live network; deselected in CI (use -m 'not network')",
]

[tool.coverage.run]
source = ["engine"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# Gate on engine/ only. It is pure, fast to test, and the code we most depend on
# being correct; chasing a whole-project number would just reward view tests.
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
