# Seed catalog for `manage.py seed_catalog`. Idempotent — safe to re-run.
#
# Ported from cardiology-feed/specialties/*.json and deduplicated: 60 config
# entries collapse to 53 journals. `nlm_uid`, `medline_ta` and the ISSNs are
# left blank here and filled in by `manage.py resolve_journals`, which is what
# finally merges pairs like "Heart" and "Heart (British Cardiac Society)".
#
# cover_color is OUR palette, not the journal's brand colour — covers use our
# typeface and a plain abbreviation. Nominative reference is defensible;
# recreating a trademarked lockup is not.
#
# Vocabulary notes: a title/abstract keyword ending in "*" matches a word stem.
# The original configs used exact words only, which dropped real papers from a
# cardiologist's NEJM feed ("Cardiotoxic Effects after Gene Therapy", "Severe
# Tricuspid Regurgitation"). Stems matter more than they look, because only
# ~14% of freshly indexed papers carry any MeSH terms at all.

specialties:
- slug: cardiology
  name: Cardiology
  description: Cardiovascular medicine — heart failure, electrophysiology, interventional, imaging, prevention.
  sort_order: 10
  mesh_terms:
  - Cardiovascular Diseases
  - Heart Diseases
  - Cardiology
  - Myocardial Infarction
  - Heart Failure
  - Arrhythmias, Cardiac
  - Coronary Artery Disease
  - Atrial Fibrillation
  - Hypertension
  - Stroke
  - Heart Valve Diseases
  - Cardiomyopathies
  - Atherosclerosis
  - Percutaneous Coronary Intervention
  - Anticoagulants
  title_keywords:
  - cardi*
  - myocard*
  - arrhythm*
  - atheroscler*
  - hypertens*
  - anticoagul*
  - antiplatelet*
  - echocardiograph*
  - valvular
  - heart
  - coronary
  - aortic
  - mitral
