name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medfeed
          POSTGRES_PASSWORD: medfeed
          POSTGRES_DB: medfeed_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U medfeed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://medfeed:medfeed@localhost:5433/medfeed_test
      TEST_DATABASE_URL: postgres://medfeed:medfeed@localhost:5433/medfeed_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy engine/

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test
        run: uv run pytest -m "not network" --cov --cov-report=term-missing
