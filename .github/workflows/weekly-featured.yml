name: Weekly featured

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py select_featured
