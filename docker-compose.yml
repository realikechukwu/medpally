# Local Postgres for development and tests only. The application itself is
# never run from compose — use `uv run manage.py runserver`.
#
# Port 5433 on the host so this never collides with a brew-installed Postgres
# on the default 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medfeed
      POSTGRES_PASSWORD: medfeed
      POSTGRES_DB: medfeed
    ports:
      - "5433:5432"
    volumes:
      - medfeed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medfeed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medfeed_pgdata:
