name: medpally

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    env_file:
      - ${ORACLE_ENV_FILE:-.env}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
            'http://127.0.0.1:8000/healthz',
            headers={
              'Host': __import__('os').environ['DOMAIN'],
              'X-Forwarded-Proto': 'https',
            },
          );
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    env_file:
      - ${ORACLE_ENV_FILE:-.env}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
