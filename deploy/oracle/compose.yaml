name: medpally

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    env_file:
      - ${ORACLE_ENV_FILE:-.env}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
            'http://127.0.0.1:8000/healthz',
            headers={
              'Host': __import__('os').environ['DOMAIN'],
              'X-Forwarded-Proto': 'https',
            },
          );
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    networks:
      edge_proxy:
        aliases:
          - medpally-web

networks:
  edge_proxy:
    external: true
    name: edge_proxy
